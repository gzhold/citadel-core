# 全栈冒烟：docker compose 拉起 web + api（直连 Neon），验证健康检查与认证链路
name: smoke

on:
  workflow_dispatch:

jobs:
  compose-smoke:
    name: compose up + health + auth probe
    runs-on: ubuntu-latest
    # 凭据来自 GitHub Environment "smoke"（Neon dev 分支专用账号，与 prod 隔离）
    environment: smoke
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - name: 构建并启动全栈（等待健康检查通过）
        run: docker compose up --build -d --wait

      - name: 后端健康检查
        run: curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'

      - name: 前端健康检查
        run: curl -fsS http://localhost:3000/api/health | grep -q '"ok"'

      - name: 认证链路探针（预期 401 INVALID_CREDENTIALS，证明 API ↔ DB 链路通畅）
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"password123"}')
          echo "login status: $status"
          test "$status" = "401"

      - name: 清理
        if: always()
        run: docker compose down --remove-orphans
