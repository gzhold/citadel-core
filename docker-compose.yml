name: citadel

# 全栈本地联调（需 Docker）：直连 Neon，不启动本地数据库。
# 首次使用：cp .env.example .env 并填入 Neon 凭据，然后 make compose-up
services:
  api:
    build:
      context: ./services/api
    image: citadel-api:local
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?请在 .env 中配置 DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?请在 .env 中配置 DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js 在构建期内联 NEXT_PUBLIC_*，必须作为 build arg 传入
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    image: citadel-web:local
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
