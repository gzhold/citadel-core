spring:
  application:
    name: citadel-api
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # schema 唯一事实来源是 Flyway；Hibernate 只做启动期校验
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

citadel:
  app-name: Citadel
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # HS256 密钥：Base64 或原始字符串，解码后至少 32 字节（openssl rand -base64 48）
    secret: ${JWT_SECRET:}
    access-ttl-seconds: 900
    refresh-ttl-days: 7
  security:
    # 生产置 true（application-prod.yml 覆盖）：强制 HTTPS，密码等敏感字段只在 TLS 上传输
    require-https: ${CITADEL_SECURITY_REQUIREHTTPS:false}

logging:
  level:
    io.citadel: INFO
